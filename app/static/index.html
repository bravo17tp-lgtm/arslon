<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sevgi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1c2e; --bg2:#16273d; --bg3:#1c3149;
    --cream:#f3ead9; --cream-dim:#a9a091; --cream-faint:#6f6a5f;
    --gold:#d4af6a; --gold-soft:rgba(212,175,106,0.16); --gold-dim:#9c7e46;
    --coral:#e0958c; --coral-soft:rgba(224,149,140,0.16);
    --line:rgba(243,234,217,0.09); --line-strong:rgba(243,234,217,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background-image:
      radial-gradient(ellipse 750px 500px at 10% -5%, rgba(224,149,140,0.13), transparent 60%),
      radial-gradient(ellipse 650px 500px at 100% 0%, rgba(212,175,106,0.11), transparent 55%),
      radial-gradient(ellipse 600px 500px at 50% 100%, rgba(232,84,120,0.07), transparent 60%);
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500;}
  button{font-family:inherit; cursor:pointer; border:none;}
  ::selection{background:var(--gold-soft);}

  #app{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:86px; position:relative; z-index:1; }
  #bgFx{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; transition:opacity .6s ease; }

  /* Loading / gate screens */
  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 28px; }
  .gate .emoji{ font-size:44px; margin-bottom:16px; }
  .gate h2{ font-size:20px; margin-bottom:8px; }
  .gate p{ color:var(--cream-dim); font-size:14px; line-height:1.6; max-width:32ch; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--gold); animation:spin 0.8s linear infinite; margin-bottom:18px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Header — profil satri */
  .profile-strip{ display:flex; align-items:center; justify-content:space-between; padding:18px 16px 4px; }
  .ps-side{ display:flex; align-items:center; gap:8px; background:none; max-width:34%; }
  .ps-side-right{ flex-direction:row-reverse; }
  .ps-avatar{ width:34px; height:34px; border-radius:50%; flex-shrink:0; background:var(--gold-soft); border:1.5px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:13px; font-weight:600; color:var(--gold); overflow:hidden; }
  .ps-avatar img{ width:100%; height:100%; object-fit:cover; }
  .ps-name{ font-size:12.5px; color:var(--cream-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ps-heart{ color:#e0707f; font-size:10px; }
  .ps-logo{ font-family:'Dancing Script',cursive; font-weight:700; font-size:32px; color:var(--gold); position:relative; line-height:1; padding:0 6px; }
  .ps-logo-spark{ position:absolute; top:-6px; right:-2px; font-size:11px; color:var(--gold-dim); animation:twinkle 2.4s ease-in-out infinite; }
  .gear-btn:active{ transform:scale(0.88) rotate(16deg); box-shadow:0 2px 6px rgba(0,0,0,0.14); }

  .view{ padding:14px 20px 10px; }
  .view.hidden{ display:none; }
  .view .card, .view .hero{ animation:fadeSlide .45s cubic-bezier(.2,.8,.3,1) both; }
  .view .card:nth-of-type(1), .view .hero{ animation-delay:0ms; }
  .view .card:nth-of-type(2){ animation-delay:60ms; }
  .view .card:nth-of-type(3){ animation-delay:120ms; }
  .view .card:nth-of-type(4){ animation-delay:180ms; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* Cards */
  .card{ background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:16px; }
  .card h3{ font-size:15.5px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  .emoji-img{ height:1em; width:1em; vertical-align:-0.15em; object-fit:contain; display:inline-block; }
  .card h3 .emoji-img{ height:16px; width:16px; vertical-align:-2px; }
  nav.bottom button .ic .emoji-img{ height:17px; width:17px; }
  nav.bottom button .ic svg{ width:20px; height:20px; color:var(--cream-faint); transition:color .2s ease, transform .2s cubic-bezier(.3,1.6,.5,1); }
  nav.bottom button.active .ic svg{ color:var(--gold); transform:translateY(-1px) scale(1.05); }
  .gear-btn .emoji-img{ height:17px; width:17px; }

  /* Hero (together counter) — redesigned */
  .hero{ background:linear-gradient(165deg, var(--bg3) 0%, var(--bg2) 55%, var(--bg) 100%); border:1px solid var(--line-strong); border-radius:26px; padding:18px 16px 14px; text-align:center; margin-bottom:16px; position:relative; overflow:hidden; box-shadow:0 20px 44px -22px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.03) inset; }
  .hero::before{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 6%, var(--gold-soft), transparent 55%), radial-gradient(1.5px 1.5px at 10% 15%, #fff, transparent), radial-gradient(1px 1px at 25% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 80% 10%, #fff, transparent), radial-gradient(1px 1px at 65% 25%, #fff, transparent), radial-gradient(1px 1px at 92% 35%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 8%, #fff, transparent); background-repeat:no-repeat; opacity:0.9; pointer-events:none; }

  .hero-bell{ position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:12px; z-index:2; }
  .hero-bell::after{ content:''; position:absolute; top:3px; right:3px; width:6px; height:6px; border-radius:50%; background:#ff5d6c; box-shadow:0 0 0 2px var(--bg2); }

  .hero-heart-wrap{ position:relative; width:36px; height:36px; margin:0 auto 2px; z-index:1; }
  .hero-heart{ width:24px; height:24px; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); animation:heartbeat 1.8s ease-in-out infinite; filter:drop-shadow(0 0 14px var(--gold-soft)); }
  @keyframes heartbeat{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 15%{ transform:translate(-50%,-50%) scale(1.18); } 30%{ transform:translate(-50%,-50%) scale(1); } 45%{ transform:translate(-50%,-50%) scale(1.1); } 60%{ transform:translate(-50%,-50%) scale(1); } }
  .sparkle{ position:absolute; color:var(--cream); font-size:9px; opacity:0; animation:twinkle 2.4s ease-in-out infinite; }
  .sparkle:nth-child(2){ top:-6px; left:2px; animation-delay:0s; }
  .sparkle:nth-child(3){ top:4px; right:-10px; font-size:7px; animation-delay:0.6s; }
  .sparkle:nth-child(4){ bottom:-4px; left:-8px; font-size:7px; animation-delay:1.2s; }
  .sparkle:nth-child(5){ bottom:0; right:0; font-size:8px; animation-delay:1.8s; }
  @keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(0.4); } 50%{ opacity:1; transform:scale(1); } }

  .hero-label{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:3px; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:8px; }
  .hero-label .hl-heart{ font-size:9px; color:var(--coral); }
  .hero-cursive{ font-family:'Dancing Script',cursive; font-weight:600; font-size:17px; color:var(--cream); margin-bottom:10px; position:relative; z-index:1; }

  .together-grid{ display:flex; align-items:flex-end; justify-content:center; gap:0; position:relative; z-index:1; }
  .t-unit{ display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
  .t-num{ font-family:'Fraunces',serif; font-size:23px; font-weight:700; color:var(--cream); line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 18px var(--gold-soft); transition:transform .2s ease; }
  .t-num.bump{ animation:numBump .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes numBump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
  .t-label{ font-size:8.5px; color:var(--cream-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
  .t-sep{ width:1px; height:24px; background:var(--line-strong); align-self:center; margin-bottom:11px; }

  .hero-scene{ position:relative; height:46px; margin:10px -16px -14px; overflow:hidden; }
  .hero-sun{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, var(--gold-dim) 35%, var(--gold-soft) 60%, transparent 72%);
    box-shadow:0 0 26px 4px var(--gold-soft); animation:sunGlow 4s ease-in-out infinite; opacity:0.85; }
  @keyframes sunGlow{ 0%,100%{ opacity:0.78; } 50%{ opacity:0.95; } }
  .hero-mtn1{ position:absolute; left:0; right:0; bottom:0; height:32px;
    background:rgba(0,0,0,0.4);
    clip-path:polygon(0% 100%,0% 62%,16% 40%,32% 60%,48% 28%,64% 52%,80% 24%,100% 44%,100% 100%); }
  .hero-mtn2{ position:absolute; left:0; right:0; bottom:0; height:18px; background:rgba(0,0,0,0.55);
    clip-path:polygon(0% 100%,0% 80%,20% 55%,38% 75%,58% 48%,76% 70%,100% 55%,100% 100%); }
  .hero-scene .sparkle{ font-size:6px; }
  .hero-scene .sparkle:nth-child(1){ top:4px; left:22%; animation-delay:0.3s; }
  .hero-scene .sparkle:nth-child(2){ top:10px; right:20%; animation-delay:1s; }
  .live-pill{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); border-radius:30px; padding:6px 15px; font-size:11px; color:var(--cream-dim); margin-top:10px; position:relative; z-index:2; }
  .live-pill .live-dot{ width:6px; height:6px; border-radius:50%; background:#5fd97a; box-shadow:0 0 0 0 rgba(95,217,122,0.6); animation:livepulse 1.6s ease-out infinite; }
  @keyframes livepulse{ 0%{ box-shadow:0 0 0 0 rgba(95,217,122,0.55); } 70%{ box-shadow:0 0 0 7px rgba(95,217,122,0); } 100%{ box-shadow:0 0 0 0 rgba(95,217,122,0); } }


  .mood-row{ display:flex; gap:12px; }
  .mood-box{ flex:1; background:rgba(243,234,217,0.04); border:1px solid var(--line); border-radius:18px; padding:16px 14px; text-align:center; transition:border-color .25s ease, background .25s ease, transform .2s ease; }
  .mood-box.set{ border-color:var(--gold-dim); background:var(--gold-soft); box-shadow:0 0 18px -6px rgba(212,175,106,0.35); }
  .mood-box .who{ font-size:11px; color:var(--cream-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }

  /* Ikki ustunli qatr: Kayfiyat + Yaqin kun */
  .row2{ display:flex; gap:12px; margin-bottom:16px; }
  .card-sm{ flex:1; margin-bottom:0; padding:16px 14px; display:flex; flex-direction:column; }
  .card-sm h3{ font-size:12px; }
  .mood-row-sm{ display:flex; justify-content:space-around; margin:10px 0 14px; }
  .mood-circle-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .mood-circle{ width:52px; height:52px; border-radius:50%; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:24px; background:rgba(243,234,217,0.03); transition:border-color .25s ease, transform .25s cubic-bezier(.3,1.6,.5,1); }
  .mood-circle.set{ border-color:var(--gold); background:var(--gold-soft); transform:scale(1.05); }
  .mood-circle-wrap .who{ font-size:10.5px; color:var(--cream-faint); }

  .pill-btn{ margin-top:auto; background:rgba(212,175,106,0.08); border:1px solid var(--line-strong); color:var(--cream-dim); border-radius:30px; padding:10px 14px; font-size:12px; display:flex; align-items:center; justify-content:center; gap:4px; transition:transform .15s ease, background .2s ease; }
  .pill-btn:active{ transform:scale(0.96); }
  .pill-btn-outline{ background:rgba(212,175,106,0.06); border:1px solid var(--gold-dim); color:var(--gold); width:100%; }

  .upcoming-row{ display:flex; align-items:center; gap:12px; margin:8px 0 14px; }
  .upcoming-emoji{ flex-shrink:0; }
  .upcoming-title{ font-size:12.5px; color:var(--cream-dim); }
  .upcoming-days{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:#e88ba0; margin-top:2px; }
  .upcoming-date{ font-size:11px; color:var(--cream-faint); margin-top:2px; }
  .upcoming-empty{ font-size:12px; color:var(--cream-faint); font-style:italic; margin:16px 0; text-align:center; flex:1; }

  /* Kun savoli — yangi joylashuv */
  .q-mark-icon{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--coral-soft); color:var(--coral); font-family:'Fraunces',serif; font-size:13px; font-weight:700; margin-right:2px; }
  .daily-tag{ margin-left:auto; background:rgba(212,175,106,0.1); border:1px solid var(--line-strong); border-radius:20px; padding:4px 10px; font-size:10.5px; color:var(--gold); display:inline-flex; align-items:center; gap:4px; }
  .q-body-row{ display:flex; align-items:flex-start; gap:10px; }
  .q-body-text{ flex:1; min-width:0; }
  .q-envelope{ flex-shrink:0; font-size:44px; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35)); }

  /* So'nggi xotira */
  .dots-btn{ margin-left:auto; background:none; color:var(--cream-faint); font-size:16px; padding:2px 6px; }
  .memory-row{ display:flex; gap:12px; align-items:center; margin:10px 0 14px; }
  .memory-thumb{ width:64px; height:64px; border-radius:14px; object-fit:cover; flex-shrink:0; }
  .memory-thumb-empty{ display:flex; align-items:center; justify-content:center; background:var(--gold-soft); font-size:22px; }
  .memory-text{ flex:1; min-width:0; }
  .memory-body{ font-size:13px; color:var(--cream); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .memory-date{ font-size:11px; color:var(--cream-faint); margin-top:5px; }
  .mood-box .emo{ font-size:28px; display:inline-block; transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
  .mood-box.set .emo{ transform:scale(1.22); }
  .mood-box .emo.empty{ font-size:13px; color:var(--cream-faint); font-style:italic; }
  .mood-box.pulse .emo{ animation:moodPulse .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes moodPulse{ 0%{ transform:scale(0.5); opacity:0; } 60%{ transform:scale(1.35); opacity:1; } 100%{ transform:scale(1.22); } }

  .special-strip{ display:flex; align-items:center; gap:10px; background:var(--coral-soft); border:1px solid rgba(224,149,140,0.3); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--cream); margin-bottom:16px; }

  /* Question card */
  .card-accent{ border-color:var(--gold-dim); background:linear-gradient(170deg, var(--bg3), var(--bg2)); position:relative; }
  .card-accent::before{ content:''; position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:0 3px 3px 0; background:linear-gradient(180deg, var(--gold), transparent); }
  .q-text{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-bottom:12px; color:var(--cream); }
  .answer-line{ font-size:13px; color:var(--cream-dim); margin-top:6px; padding-top:8px; border-top:1px solid var(--line); }

  .q-input-row{ display:flex; align-items:center; gap:10px; }
  .q-input-row input[type=text]{ flex:1; margin:0; }
  .q-send-btn{ flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--gold); color:#1a2233; font-size:17px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -8px rgba(212,175,106,0.55); transition:transform .15s cubic-bezier(.3,1.6,.5,1); }
  .q-send-btn:active{ transform:scale(0.88); }

  .success-burst{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0 4px; }
  .success-burst .check{ width:46px; height:46px; border-radius:50%; background:var(--gold-soft); border:1.5px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--gold); animation:successPop .5s cubic-bezier(.3,1.6,.5,1); }
  .success-burst .msg{ margin-top:10px; font-size:12.5px; color:var(--cream-dim); }
  @keyframes successPop{ 0%{ transform:scale(0); opacity:0; } 60%{ transform:scale(1.18); opacity:1; } 100%{ transform:scale(1); } }
  .answer-line b{ color:var(--gold); }

  /* Inputs */
  textarea, input[type=text], input[type=number], input[type=date]{
    width:100%; background:rgba(243,234,217,0.05); border:1px solid var(--line-strong); border-radius:12px;
    color:var(--cream); font-family:inherit; font-size:14px; padding:12px 14px; resize:vertical;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  textarea::placeholder, input::placeholder{ color:var(--cream-faint); }
  textarea:focus, input:focus{ outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(212,175,106,0.14), 0 0 16px -4px rgba(212,175,106,0.3); }

  .btn{ border-radius:13px; padding:13px 18px; font-size:14px; font-weight:600; transition:transform .15s ease, opacity .15s; }
  .btn:active{ transform:scale(0.96); }
  .btn-gold{ background:var(--gold); color:#1a2233; width:100%; box-shadow:0 8px 20px -8px rgba(212,175,106,0.5); }
  .btn-ghost{ background:rgba(243,234,217,0.04); color:var(--cream-dim); border:1px solid var(--line-strong); width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:10px; }

  /* Journal */
  /* Kundalik — ro'yxat sahifasi */
  .j-header{ text-align:center; padding:6px 4px 16px; }
  .j-header-title{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--gold); display:flex; align-items:center; justify-content:center; gap:6px; }
  .j-heart-spark{ display:inline-flex; gap:2px; }
  .j-header-sub{ font-size:12px; color:var(--cream-faint); margin-top:4px; }

  .j-filters{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; scrollbar-width:none; }
  .j-filters::-webkit-scrollbar{ display:none; }
  .j-filter-pill{ flex-shrink:0; background:rgba(243,234,217,0.04); border:1px solid var(--line-strong); color:var(--cream-dim); border-radius:20px; padding:8px 16px; font-size:12.5px; white-space:nowrap; transition:all .2s ease; }
  .j-filter-pill.active{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }

  .j-search-row{ margin-bottom:16px; }
  .j-search-row input{ margin:0; }

  .j-date-divider{ text-align:center; font-size:11px; color:var(--gold-dim); letter-spacing:0.06em; margin:18px 0 10px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .j-empty{ text-align:center; padding:50px 20px; }
  .j-empty-icon{ margin-bottom:12px; }
  .j-empty-title{ font-family:'Fraunces',serif; font-size:16px; color:var(--cream); margin-bottom:4px; }
  .j-empty-sub{ font-size:12.5px; color:var(--cream-faint); }

  .j-card{ background:rgba(243,234,217,0.03); border:1px solid var(--line-strong); border-radius:18px; padding:14px; margin-bottom:12px; position:relative; transition:transform .15s ease; }
  .j-card:active{ transform:scale(0.985); }
  .j-badge{ position:absolute; top:-6px; right:12px; width:24px; height:24px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px -2px rgba(0,0,0,0.4); }
  .j-card-body{ display:flex; gap:12px; align-items:flex-start; }
  .j-thumb-wrap{ position:relative; flex-shrink:0; }
  .j-thumb{ width:64px; height:64px; border-radius:14px; object-fit:cover; }
  .j-thumb-play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.25); border-radius:14px; }
  .j-quote-mark{ width:64px; height:64px; border-radius:14px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .j-card-text{ flex:1; min-width:0; }
  .j-card-title{ font-size:13.5px; color:var(--cream); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .j-card-meta{ font-size:11px; color:var(--cream-faint); margin-top:6px; }

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

// ---------- iOS (Apple) uslubidagi emoji rasmlari ----------
const EMOJI_MAP = {
  "🏡":"1f3e1", "📔":"1f4d4", "😊":"1f60a", "📝":"1f4dd", "💌":"1f48c",
  "⚙️":"2699-fe0f", "💞":"1f49e", "🎂":"1f382", "💘":"1f498", "✍️":"270d-fe0f",
  "🎉":"1f389", "❓":"2753", "📊":"1f4ca", "💛":"1f49b", "🌿":"1f33f",
  "😄":"1f604", "🙂":"1f642", "😐":"1f610", "😔":"1f614", "😢":"1f622",
  "😡":"1f621", "🥱":"1f971", "🥰":"1f970", "⏳":"23f3", "🚫":"1f6ab", "⚠️":"26a0-fe0f",
  "💗":"1f497",
};
function e(emoji, size) {
  const code = EMOJI_MAP[emoji];
  const style = size ? ` style="height:${size}px;width:${size}px;"` : "";
  if (!code) return emoji;
  return `<img class="emoji-img" src="https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-64/${code}.png"${style} alt="" onerror="this.outerHTML='${emoji}'">`;
}

async function api(path, opts = {}) {
  const headers = opts.body instanceof FormData ? {} : {"Content-Type": "application/x-www-form-urlencoded"};
  headers["X-Telegram-Init-Data"] = initData;
  const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers||{}) } });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}
function formBody(obj) {
  return Object.entries(obj).map(([k,v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v ?? "")}`).join("&");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.innerHTML = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

let STATE = null;
let THEMES_DATA = null;
let CURRENT_THEME_KEY = "tungi";

function applyTheme(themeObj) {
  if (!themeObj) return;
  const root = document.documentElement.style;
  ["bg","bg2","bg3","cream","cream-dim","cream-faint","gold","gold-soft","gold-dim","coral","coral-soft","line","line-strong"]
    .forEach(k => { if (themeObj[k]) root.setProperty(`--${k}`, themeObj[k]); });
  // Telegram'ning o'z header/background rangini ham ilova temasiga moslaymiz
  try {
    if (tg && themeObj.bg) {
      tg.setHeaderColor?.(themeObj.bg);
      tg.setBackgroundColor?.(themeObj.bg);
    }
  } catch (err) { /* eski Telegram versiyalarida bu metodlar bo'lmasligi mumkin */ }
  initParticles(CURRENT_THEME_KEY, themeObj);
}
function haptic(style) {
  try { tg?.HapticFeedback?.impactOccurred?.(style || "light"); } catch (err) {}

// ---------- Fonda harakatlanuvchi zarrachalar (temaga qarab) ----------
const PARTICLE_KIND = { tungi: "stars", bahor: "leaves", quyosh: "embers", yorugor: "hearts" };
let fx = null;
function initParticles(themeKey, themeObj) {
  const canvas = document.getElementById("bgFx");
  const kind = PARTICLE_KIND[themeKey] || "stars";
  if (fx) { fx.stop(); fx = null; }
  fx = createParticleField(canvas, kind, themeObj);
  fx.start();
}
function createParticleField(canvas, kind, themeObj) {
  const ctx = canvas.getContext("2d");
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w, h, particles = [], raf = null, running = false;

  const COUNTS = { stars: 130, leaves: 22, embers: 26, hearts: 18 };
  const COLORS = {
    stars: [themeObj?.gold || "#d4af6a", "#ffffff"],
    leaves: [themeObj?.gold || "#9bc27c", themeObj?.coral || "#e8a3b8", "#7fae63"],
    embers: [themeObj?.gold || "#e8a33d", themeObj?.coral || "#e2735a"],
    hearts: [themeObj?.coral || "#e0958c", themeObj?.gold || "#d4af6a"],
  };

  function resize() {
    w = canvas.width = Math.floor(innerWidth * dpr);
    h = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawn() {
    const n = COUNTS[kind] || 30;
    particles = Array.from({ length: n }, () => makeParticle(true));
  }
  function makeParticle(initial) {
    const colors = COLORS[kind];
    const color = colors[Math.floor(Math.random() * colors.length)];
    if (kind === "stars") {
      const big = Math.random() < 0.15;
      return { x: rand(0, w), y: rand(0, h), r: (big ? rand(1.6, 2.6) : rand(0.5, 1.3)) * dpr, tw: rand(0, Math.PI * 2), speed: rand(0.15, 0.4) * dpr, color, big };
    }
    if (kind === "leaves") {
      return { x: rand(0, w), y: initial ? rand(-h, h) : -20 * dpr, size: rand(6, 12) * dpr, rot: rand(0, 360), rotSpeed: rand(-1.2, 1.2), vy: rand(0.35, 0.8) * dpr, sway: rand(0, Math.PI * 2), swaySpeed: rand(0.01, 0.025), color };
    }
    if (kind === "embers") {
      return { x: rand(0, w), y: initial ? rand(0, h) : h + 10 * dpr, r: rand(1, 2.6) * dpr, vy: -rand(0.25, 0.7) * dpr, sway: rand(0, Math.PI * 2), swaySpeed: rand(0.015, 0.03), alpha: rand(0.35, 0.9), color };
    }
    // hearts
    return { x: rand(0, w), y: initial ? rand(0, h) : h + 20 * dpr, size: rand(7, 13) * dpr, vy: -rand(0.2, 0.45) * dpr, sway: rand(0, Math.PI * 2), swaySpeed: rand(0.012, 0.02), alpha: rand(0.35, 0.8), color };
  }

  function drawHeart(x, y, size, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(size / 14, size / 14);
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(0, 0, -7, -3, -7, -7);
    ctx.bezierCurveTo(-7, -11, -1, -11, 0, -5);
    ctx.bezierCurveTo(1, -11, 7, -11, 7, -7);
    ctx.bezierCurveTo(7, -3, 0, 0, 0, 4);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }
  function drawLeaf(x, y, size, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((rot * Math.PI) / 180);
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size * 0.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.fill();
    ctx.restore();
  }

  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      if (kind === "stars") {
        p.tw += 0.02;
        const alpha = 0.4 + Math.abs(Math.sin(p.tw)) * 0.55;
        p.y += p.speed * 0.05;
        if (p.y > h) p.y = 0;
        ctx.beginPath();
        ctx.globalAlpha = Math.min(alpha, 1);
        ctx.fillStyle = p.color;
        if (p.big) { ctx.shadowColor = p.color; ctx.shadowBlur = 6 * dpr; }
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else if (kind === "leaves") {
        p.sway += p.swaySpeed;
        p.x += Math.sin(p.sway) * 0.6 * dpr;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        if (p.y > h + 20 * dpr) Object.assign(p, makeParticle(false));
        drawLeaf(p.x, p.y, p.size, p.rot, p.color);
      } else if (kind === "embers") {
        p.sway += p.swaySpeed;
        p.x += Math.sin(p.sway) * 0.4 * dpr;
        p.y += p.vy;
        if (p.y < -10 * dpr) Object.assign(p, makeParticle(false));
        ctx.beginPath();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === "hearts") {
        p.sway += p.swaySpeed;
        p.x += Math.sin(p.sway) * 0.5 * dpr;
        p.y += p.vy;
        if (p.y < -20 * dpr) Object.assign(p, makeParticle(false));
        drawHeart(p.x, p.y, p.size, p.color, p.alpha);
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(tick);
  }

  function onVisibility() {
    if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); }
    else if (!running) { running = true; raf = requestAnimationFrame(tick); }
  }
  function onResize() { resize(); }

  return {
    start() {
      resize(); spawn();
      running = true;
      raf = requestAnimationFrame(tick);
      window.addEventListener("resize", onResize);
      document.addEventListener("visibilitychange", onVisibility);
    },
    stop() {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      document.removeEventListener("visibilitychange", onVisibility);
    },
  };
}

// ---------- Bosh sahifa ----------
function computeTogetherLive(anniversaryISO) {
  const d0 = new Date(anniversaryISO + "T00:00:00");
  const now = new Date();
  let years = now.getFullYear() - d0.getFullYear();
  let months = now.getMonth() - d0.getMonth();
  let days = now.getDate() - d0.getDate();
  let h = now.getHours() - d0.getHours();
  let m = now.getMinutes() - d0.getMinutes();
  let s = now.getSeconds() - d0.getSeconds();
  if (s < 0) { s += 60; m--; }
  if (m < 0) { m += 60; h--; }
  if (h < 0) { h += 24; days--; }
  if (days < 0) { const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0); days += prevMonth.getDate(); months--; }
  if (months < 0) { months += 12; years--; }
  return { years, months, days, h, m, s };
}

            ${entry.media_type === "video" ? `<div class="j-thumb-play">${e("▶️",14)}</div>` : ""}
          </div>
        ` : `<div class="j-quote-mark">${e("❝",18)}</div>`}
        <div class="j-card-text">
          <div class="j-card-title">${escapeHtml(entry.title || entry.text || "")}</div>
          <div class="j-card-meta">${e(typeIcon,12)} ${typeLabel} · ${timeStr}</div>
        </div>
      </div>
      <div class="j-card-footer">
        <button class="j-card-action j-like-btn ${entry.liked_by_me ? "liked" : ""}" data-id="${entry.id}">${e(entry.liked_by_me ? "❤️" : "🤍",14)} ${entry.like_count}</button>
        <span class="j-card-action">${e("💬",14)} ${entry.comment_count}</span>
        <span style="flex:1;"></span>
        <span class="j-card-action">${e("🔖",14)}</span>
      </div>
    </div>
  `;
}

async function openJournalDetail(id) {
  const entry = await api(`/api/journal/${id}`);
  const el = document.getElementById("view-journal");
  el.innerHTML = `
    <div class="j-detail-header">
      <button class="icon-circle-btn" id="jBack">‹</button>
      <div class="j-detail-title">${e("💌",16)} XOTIRA</div>
      <div style="display:flex; gap:8px;">
        <button class="icon-circle-btn" id="jEdit">${e("✏️",14)}</button>
        <button class="icon-circle-btn" id="jDeleteBtn">${e("🗑️",14)}</button>
      </div>
    </div>
    <div class="j-detail-date">${fmtDate(entry.created_at)}</div>

    <div class="card j-detail-card" style="margin-bottom:90px;">
      <div class="j-detail-author-row">
        <div class="j-avatar-sm">${(entry.name||"?")[0]}</div>
        <div style="flex:1;">
          <div class="j-detail-author-name">${entry.name} ${e("❤️",11)}</div>
          ${entry.location ? `<div class="j-detail-location">${e("📍",11)} ${escapeHtml(entry.location)}</div>` : ""}
        </div>
        ${entry.is_important ? `<div class="j-important-tag">${e("👑",11)} Muhim kun</div>` : ""}
      </div>

      ${entry.title ? `<div class="j-detail-title-text">${escapeHtml(entry.title)}</div>` : ""}
      ${entry.text ? `<div class="j-detail-body">${escapeHtml(entry.text)}</div>` : ""}
      ${entry.hashtags ? `<div class="j-hashtags">${entry.hashtags.split(",").map(h => "#" + h.trim()).filter(h => h !== "#").join(" ")}</div>` : ""}

      ${entry.photo_url ? `
        <div class="j-detail-media">
          ${entry.media_type === "video" ? `<video src="${entry.photo_url}" controls class="j-detail-img"></video>` : `<img src="${entry.photo_url}" class="j-detail-img">`}
        </div>
      ` : ""}

      <div class="j-action-row">
        <button class="j-action-btn ${entry.liked_by_me ? "liked" : ""}" id="jLikeBtn">${e(entry.liked_by_me ? "❤️" : "🤍",18)} ${entry.like_count}</button>
        <span class="j-action-btn">${e("💬",18)} ${entry.comment_count}</span>
        <span style="flex:1;"></span>
        <button class="j-action-btn" id="jBookmarkBtn">${e("🔖",18)}</button>
      </div>

      <div class="j-comments-section">
        <div class="j-comments-title">${e("💬",14)} Izohlar</div>
        <div id="jCommentsList">
          ${entry.comments.length ? entry.comments.map(c => `
            <div class="j-comment">
              <div class="j-avatar-sm">${(c.name||"?")[0]}</div>
              <div style="flex:1;">
                <div class="j-comment-head"><b>${escapeHtml(c.name)}</b> <span class="j-comment-time">${fmtDate(c.created_at)}</span></div>
                <div class="j-comment-text">${escapeHtml(c.text)}</div>
              </div>
            </div>
          `).join("") : `<div class="j-empty-sub" style="text-align:left; padding:8px 0;">Hali izoh yo'q</div>`}
        </div>
        <div class="j-comment-input-row">
          <input type="text" id="jCommentInput" placeholder="Izoh qo'shish...">
          <button class="q-send-btn" id="jCommentSend">${e("➕",16)}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("jBack").onclick = () => { haptic(); renderJournalList(); };
  document.getElementById("jLikeBtn").onclick = async () => {
    haptic();
    await api(`/api/journal/${id}/like`, { method: "POST" });
    openJournalDetail(id);
  };
  document.getElementById("jBookmarkBtn").onclick = async () => {
    haptic();
    const res = await api(`/api/journal/${id}/bookmark`, { method: "POST" });
    toast(res.saved ? `Saqlandi ${e("🔖",14)}` : "Xatcho'pdan olindi");
  };
  document.getElementById("jCommentSend").onclick = async () => {
    const input = document.getElementById("jCommentInput");
    const text = input.value.trim();
    if (!text) return;
    haptic();
    await api(`/api/journal/${id}/comments`, { method: "POST", body: formBody({text}) });
    openJournalDetail(id);
  };
  document.getElementById("jEdit").onclick = () => openJournalForm(entry);
  document.getElementById("jDeleteBtn").onclick = async () => {
    if (!confirm("Xotirani o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.")) return;
    await api(`/api/journal/${id}`, { method: "DELETE" });
    toast("O'chirildi");
    await loadJournal();
  };
}

function openJournalForm(existing) {
  const wrap = document.getElementById("journalFormWrap") || (() => {
    const d = document.createElement("div"); d.id = "journalFormWrap"; document.getElementById("view-journal").appendChild(d); return d;
  })();
  const isEdit = !!existing;
  wrap.innerHTML = `
    <div class="modal-overlay open">
      <div class="modal-sheet">
        <div class="modal-head"><h3>${e("✍️",16)} ${isEdit ? "Xotirani tahrirlash" : "Yangi xotira"}</h3><button class="close-x" id="jCancel">✕</button></div>
        <input type="text" id="jTitle" placeholder="Sarlavha (ixtiyoriy)" value="${isEdit ? escapeHtml(existing.title||"") : ""}" style="margin-bottom:10px;">
        <textarea id="jText" placeholder="Xotirangizni yozing..." rows="4">${isEdit ? escapeHtml(existing.text||"") : ""}</textarea>
        ${isEdit ? "" : `<input type="file" id="jPhoto" accept="image/*,video/*" style="margin-top:10px; color:var(--cream-dim); font-size:13px;">`}
        <input type="text" id="jLocation" placeholder="Joylashuv (ixtiyoriy)" value="${isEdit ? escapeHtml(existing.location||"") : ""}" style="margin-top:10px;">
        <input type="text" id="jHashtags" placeholder="Hashtaglar, vergul bilan: biz, xotira" value="${isEdit ? escapeHtml(existing.hashtags||"") : ""}" style="margin-top:10px;">
        <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--cream-dim);">
          <input type="checkbox" id="jImportant" ${isEdit && existing.is_important ? "checked" : ""} style="width:auto;"> ${e("👑",13)} Muhim kun sifatida belgilash
        </label>
        <button class="btn btn-gold" style="margin-top:14px;" id="jSave">${isEdit ? "Saqlash" : "Qo'shish"}</button>
      </div>
    </div>
  `;
  document.getElementById("jCancel").onclick = () => wrap.innerHTML = "";
  document.getElementById("jSave").onclick = async () => {
    const title = document.getElementById("jTitle").value.trim();
    const text = document.getElementById("jText").value.trim();
    const location = document.getElementById("jLocation").value.trim();
    const hashtags = document.getElementById("jHashtags").value.trim();
    const isImportant = document.getElementById("jImportant").checked;
    haptic();
    if (isEdit) {
      await api(`/api/journal/${existing.id}`, {
        method: "PUT",
        body: formBody({ title, text, location, hashtags, is_important: isImportant }),
      });
      wrap.innerHTML = "";
      toast(`Yangilandi ${e("💛",16)}`);
      openJournalDetail(existing.id);
    } else {
      const photoInput = document.getElementById("jPhoto");
      const fd = new FormData();
      fd.append("title", title);
      fd.append("text", text);
      fd.append("location", location);
      fd.append("hashtags", hashtags);
      fd.append("is_important", isImportant);
      if (photoInput.files[0]) fd.append("photo", photoInput.files[0]);
      await api("/api/journal", { method: "POST", body: fd });
      wrap.innerHTML = "";
      toast(`Saqlandi ${e("💛",16)}`);
      await loadJournal();
    }
  };
}

// ---------- Kayfiyat ----------
async function loadMood() {
  const data = await api("/api/moods");
  const el = document.getElementById("view-mood");
  el.innerHTML = `
    <div class="card">
      <h3>${e("😊")} Bugungi kayfiyatingiz</h3>
      <div class="emoji-grid" id="emojiGrid">
        ${STATE.mood_emojis.map(em => `<button class="emoji-pick" data-e="${em}">${e(em,26)}</button>`).join("")}
      </div>
    </div>
    <div class="card">
      <h3>${e("📊")} So'nggi 30 kun</h3>
      <canvas id="moodChart" height="180"></canvas>
      <div class="legend-row">
        <span><span class="dot" style="background:var(--gold);"></span>Siz</span>
        ${data.partner_name ? `<span><span class="dot" style="background:var(--coral);"></span>${data.partner_name}</span>` : ""}
      </div>
    </div>
  `;
  document.querySelectorAll("#emojiGrid .emoji-pick").forEach(btn => {
    btn.onclick = async () => {
      document.querySelectorAll("#emojiGrid .emoji-pick").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      await api("/api/mood", { method:"POST", body: formBody({emoji: btn.dataset.e, note:""}) });
      toast(`Kayfiyat saqlandi ${e("💛",16)}`);
    };
  });

  const emojiScore = em => ["😢","😡","😔","🥱","😐","🙂","😄","🥰"].indexOf(em);
  const labels = [...new Set([...data.mine, ...data.partner].map(m=>m.mood_date))].sort();
  const mineMap = Object.fromEntries(data.mine.map(m=>[m.mood_date, emojiScore(m.emoji)]));
  const partnerMap = Object.fromEntries(data.partner.map(m=>[m.mood_date, emojiScore(m.emoji)]));

  new Chart(document.getElementById("moodChart"), {
    type: "line",
    data: {
      labels: labels.map(d => d.slice(5)),
      datasets: [
        { label:"Siz", data: labels.map(d => mineMap[d] ?? null), borderColor:"#d4af6a", backgroundColor:"rgba(212,175,106,0.15)", tension:0.35, spanGaps:true, pointRadius:2 },
        { label:"Sherik", data: labels.map(d => partnerMap[d] ?? null), borderColor:"#e0958c", backgroundColor:"rgba(224,149,140,0.15)", tension:0.35, spanGaps:true, pointRadius:2 },
      ]
    },
    options: {
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ min:0, max:7, ticks:{ color:"#6f6a5f", stepSize:1 }, grid:{ color:"rgba(243,234,217,0.06)" } },
        x:{ ticks:{ color:"#6f6a5f" }, grid:{ display:false } }
      }
    }
  });
}

// ---------- Rejalar ----------
async function loadPlans() {
  const plans = await api("/api/plans");
  const el = document.getElementById("view-plans");
  el.innerHTML = `
    <div class="card">
      <h3>${e("📝")} Ochiq rejalar</h3>
      <div id="plansList">
        ${plans.length === 0 ? `<div class="empty">Hozircha rejalar yo'q.</div>` :
          plans.map(p => `
            <div class="plan-item">
              <button class="check" data-id="${p.id}">✓</button>
              <div style="flex:1;">
                <div class="plan-text">${escapeHtml(p.text)}</div>
                <div class="plan-by">taklif: ${p.name}</div>
              </div>
            </div>
          `).join("")}
      </div>
      <textarea id="planInput" placeholder="Yangi reja yoki date-idea..." rows="2" style="margin-top:14px;"></textarea>
      <button class="btn btn-gold" style="margin-top:8px;" id="planAdd">Qo'shish</button>
    </div>
  `;
  document.querySelectorAll(".check").forEach(btn => {
    btn.onclick = async () => {
      btn.classList.add("done");
      await api(`/api/plans/${btn.dataset.id}/done`, { method:"POST" });
      setTimeout(loadPlans, 400);
    };
  });
  document.getElementById("planAdd").onclick = async () => {
    const text = document.getElementById("planInput").value.trim();
    if (!text) return;
    await api("/api/plans", { method:"POST", body: formBody({text}) });
    toast(`Reja qo'shildi ${e("🌿",16)}`);
    await loadPlans();
  };
}

// ---------- Sevgi burchagi ----------
async function loadLove() {
  const stats = await api("/api/stats");

  el.innerHTML = `
    <div class="card">
      <h3>${e("💌")} Sevgi xati yuborish</h3>
      <textarea id="loveText" placeholder="Sherigingizga xabar yozing..." rows="3"></textarea>
      <button class="btn btn-gold" style="margin-top:10px;" id="loveSend">Yuborish</button>
    </div>
    <div class="card">
      <h3>${e("📊")} Statistika</h3>
      <div class="mood-row">
        <div class="mood-box"><div class="who">Birga</div><div class="emo" style="font-size:20px;">${stats.together ? stats.together.total_days : "—"} kun</div></div>
        <div class="mood-box"><div class="who">Xotiralar</div><div class="emo" style="font-size:20px;">${stats.journal_count}</div></div>
      </div>

  `;
  document.getElementById("loveSend").onclick = async () => {

// ---------- Sozlamalar ----------
async function openSettingsModal() {
  document.getElementById("settingsModal").classList.add("open");
  await refreshSettingsSummary();
}
function setupSettings() {
  const modal = document.getElementById("settingsModal");
  document.getElementById("closeSettings").onclick = () => modal.classList.remove("open");

  document.getElementById("openAnniversary").onclick = () => toggle("panelAnniversary");
  document.getElementById("openSpecial").onclick = async () => { toggle("panelSpecial"); await loadSpecialList(); };
  document.getElementById("openLoveTest").onclick = async () => { toggle("panelLoveTest"); await loadLoveTest(); };
  document.getElementById("openTheme").onclick = () => { toggle("panelTheme"); renderThemeGrid(); };

  document.getElementById("saveAnniv").onclick = async () => {
    const v = document.getElementById("annivInput").value;
    if (!v) return;
    await api("/api/settings/anniversary", { method:"POST", body: formBody({value:v}) });
    toast(`Saqlandi ${e("💞",16)}`);
    await refreshSettingsSummary();
    await loadHome();
  };

  document.getElementById("addSpecial").onclick = async () => {
    const label = document.getElementById("specialLabel").value.trim();
    const month = document.getElementById("specialMonth").value;
    const day = document.getElementById("specialDay").value;
    if (!label || !month || !day) return;
    await api("/api/settings/special_dates", { method:"POST", body: formBody({label, month, day}) });
    document.getElementById("specialLabel").value = "";
    document.getElementById("specialMonth").value = "";
    document.getElementById("specialDay").value = "";
    toast(`Qo'shildi ${e("🎉",16)}`);
    await loadSpecialList();
    await refreshSettingsSummary();
    await loadHome();
  };
}
// ---------- Profil ----------
function setupProfile() {
  const modal = document.getElementById("profileModal");
  document.getElementById("profileBtn").onclick = async () => {
    haptic();
    modal.classList.add("open");
    await loadProfile();
  };
  document.getElementById("closeProfile").onclick = () => modal.classList.remove("open");
  document.getElementById("partnerStripBtn").onclick = () => {
    haptic();
    toast(STATE?.partner_name ? `💞 ${STATE.partner_name} bilan bog'langansiz` : "Sherik hali qo'shilmagan");
  };
}
async function loadProfile() {
  try {
    const p = await api("/api/profile");
    const initial = (p.name || "?").trim()[0]?.toUpperCase() || "?";
    document.getElementById("profileAvatar").textContent = initial;
    document.getElementById("profileName").textContent = p.name;
    document.getElementById("profileUsername").textContent = p.username ? "@" + p.username : "username yo'q";
    document.getElementById("profileId").textContent = p.user_id;
    document.getElementById("profileJoined").textContent = fmtDate(p.joined_at);
    document.getElementById("profileOpens").textContent = `${p.open_count}x`;
    document.getElementById("profilePartner").textContent = p.partner_name || "hali qo'shilmagan";
    document.getElementById("profileAdminRow").style.display = p.is_admin ? "flex" : "none";
  } catch (err) {
    toast("Profilni yuklab bo'lmadi");
  }
}
function toggle(id) {
  document.querySelectorAll(".sub-panel").forEach(p => { if (p.id !== id) p.classList.remove("open"); });
  document.getElementById(id).classList.toggle("open");
}
async function refreshSettingsSummary() {
  const anniv = await api("/api/settings/anniversary");
  document.getElementById("annivVal").textContent = anniv.anniversary || "belgilanmagan";
  document.getElementById("annivInput").value = anniv.anniversary || "";
  const specials = await api("/api/settings/special_dates");
  document.getElementById("specialCount").textContent = specials.length + " ta";
  const lt = await api("/api/settings/love_test/result");
  document.getElementById("loveTestVal").textContent = lt.mine_label || "o'tilmagan";
  document.getElementById("themeVal").textContent = THEMES_DATA[CURRENT_THEME_KEY]?.label || "Tungi";
}

function renderThemeGrid() {
  const grid = document.getElementById("themeGrid");
  grid.innerHTML = Object.entries(THEMES_DATA).map(([key, t]) => `
    <button class="theme-swatch ${key === CURRENT_THEME_KEY ? "active" : ""}" data-key="${key}">
      <div class="circle" style="background:${t.swatch};"></div>
      <div class="name">${t.label}</div>
    </button>
  `).join("");
  grid.querySelectorAll(".theme-swatch").forEach(btn => {
    btn.onclick = async () => {
      const key = btn.dataset.key;
      CURRENT_THEME_KEY = key;
      applyTheme(THEMES_DATA[key]);
      await api("/api/settings/theme", { method:"POST", body: formBody({value:key}) });
      renderThemeGrid();
      document.getElementById("themeVal").textContent = THEMES_DATA[key].label;
      toast(`Tema o'zgartirildi ${e("🎉",16)}`);
    };
  });
}
async function loadSpecialList() {
  const specials = await api("/api/settings/special_dates");
  document.getElementById("specialList").innerHTML = specials.map(s => `
    <div class="special-item">
      <span>${s.label} — ${s.day}.${String(s.month).padStart(2,"0")}</span>
      <button class="del-x" data-id="${s.id}">✕</button>
    </div>
  `).join("") || `<div class="empty">Hali qo'shilmagan.</div>`;
  document.querySelectorAll("#specialList .del-x").forEach(btn => {
    btn.onclick = async () => {
      await api(`/api/settings/special_dates/${btn.dataset.id}`, { method:"DELETE" });
      await loadSpecialList();
      await refreshSettingsSummary();
      await loadHome();
    };
  });
}

let ltAnswers = [];
async function loadLoveTest() {
  const panel = document.getElementById("panelLoveTest");
  const result = await api("/api/settings/love_test/result");
  const { questions, languages } = await api("/api/settings/love_test/questions");
  ltAnswers = [];

  function renderQ(i) {
    if (i >= questions.length) {
      const answersStr = ltAnswers.join(",");
      api("/api/settings/love_test/submit", { method:"POST", body: formBody({answers: answersStr}) }).then(res => {
        panel.innerHTML = `<div class="result-box">Sizning sevgi tilingiz:<div class="lang">${res.top_label}</div></div>`;
        refreshSettingsSummary();
      });
      return;
    }
    const q = questions[i];
    panel.innerHTML = `
      <div class="lt-progress">${i+1} / ${questions.length}</div>
      <div class="q-text" style="margin-bottom:10px;">${q.q}</div>
      ${q.options.map(o => `<button class="lt-option" data-k="${o.key}">${o.text}</button>`).join("")}
    `;
    panel.querySelectorAll(".lt-option").forEach(btn => {
      btn.onclick = () => { ltAnswers.push(btn.dataset.k); renderQ(i+1); };
    });
  }

  if (result.mine) {
    panel.innerHTML = `
      <div class="result-box">Sizning sevgi tilingiz:<div class="lang">${result.mine_label}</div></div>
      ${result.partner ? `<div class="result-box">${result.partner_name} tili:<div class="lang">${result.partner_label}</div></div>` : ""}
      <button class="btn btn-ghost" style="margin-top:10px;" id="ltRetake">Qayta topshirish</button>
    `;
    document.getElementById("ltRetake").onclick = () => renderQ(0);
  } else {
    renderQ(0);
  }
}

boot();
</script>
